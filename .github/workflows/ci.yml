name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Validate browser JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/issue-center.js
          node --check app/static/cleanup.js
          node --check app/static/doctor.js
          node --check app/static/download-client-doctor.js

      - name: Build Docker image
        run: docker build -t arrmedic:ci .
