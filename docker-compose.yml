services:
  arrmedic:
    image: ghcr.io/kasundigital/arrmedic:latest
    pull_policy: always
    container_name: arrmedic
    ports:
      - "7080:7080"
    environment:
      - ARRMEDIC_HOST_ROOT=/host
    volumes:
      - ./config:/config
      # Recommended: read-only view of the complete host filesystem for
      # path, permission, storage and hardlink diagnostics.
      - /:/host:ro
    restart: unless-stopped
